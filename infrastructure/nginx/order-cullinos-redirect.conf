# Decommissioned Customer web storefront -> Cullinos App landing
server {
    listen 80;
    listen 443 ssl http2;
    server_name order.cullinos.com;

    # SSL certs managed by existing portal certs — include if shared.
    # ssl_certificate     /etc/letsencrypt/live/order.cullinos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/order.cullinos.com/privkey.pem;

    return 301 https://guest.cullinos.com$request_uri;
}
