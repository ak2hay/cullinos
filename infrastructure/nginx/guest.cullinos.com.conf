# Guest deep-link host — App Links + download landing
# Copy www files to /var/www/cullinos/guest-landing
# Ensure DNS A record for guest.cullinos.com points at this VM, then certbot.

server {
    server_name guest.cullinos.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    root /var/www/cullinos/guest-landing;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Digital Asset Links for Android App Links (com.cullinos.guest)
    location = /.well-known/assetlinks.json {
        default_type application/json;
        add_header Cache-Control "public, max-age=3600" always;
        try_files /.well-known/assetlinks.json =404;
    }

    # App Link paths + get landing — same download-first page
    location / {
        try_files $uri /index.html =404;
    }

    listen 443 ssl; # managed by Certbot
    # ssl_certificate /etc/letsencrypt/live/guest.cullinos.com/fullchain.pem;
    # ssl_certificate_key /etc/letsencrypt/live/guest.cullinos.com/privkey.pem;
}

server {
    listen 80;
    server_name guest.cullinos.com;
    return 301 https://$host$request_uri;
}
