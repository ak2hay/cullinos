# Cullinos API — reverse proxy with WebSocket support (Socket.IO)
# Install: cp to /etc/nginx/sites-available/ and symlink to sites-enabled
# SSL: certbot --nginx -d api.cullinos.com

upstream cullinos_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name api.cullinos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name api.cullinos.com;

    # certbot will populate these paths
    ssl_certificate     /etc/letsencrypt/live/api.cullinos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cullinos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location / {
        proxy_pass http://cullinos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
