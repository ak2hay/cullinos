# Cullinos API — reverse proxy with WebSocket support (Socket.IO)
# Install: cp to /etc/nginx/sites-available/ and symlink to sites-enabled
# SSL: certbot --nginx -d api.cullinos.com

upstream cullinos_api {
    server 127.0.0.1:3000;
    keepalive 32;
}

limit_req_zone $binary_remote_addr zone=cullinos_api:10m rate=30r/s;
limit_req_zone $binary_remote_addr zone=cullinos_api_auth:10m rate=5r/s;

server {
    listen 80 default_server;
    server_name api.cullinos.com in17906.onliveserver.com _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($host = api.cullinos.com) {
            return 301 https://$host$request_uri;
        }
        proxy_pass http://cullinos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}

server {
    listen 443 ssl http2;
    server_name api.cullinos.com;

    # certbot will populate these paths
    ssl_certificate     /etc/letsencrypt/live/api.cullinos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cullinos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;
    client_body_timeout 30s;
    proxy_connect_timeout 10s;
    proxy_send_timeout 60s;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /api/v1/auth/ {
        limit_req zone=cullinos_api_auth burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://cullinos_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=cullinos_api burst=60 nodelay;
        limit_req_status 429;
        proxy_pass http://cullinos_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }
}
