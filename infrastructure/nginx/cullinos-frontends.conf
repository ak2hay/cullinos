# order.cullinos.com is decommissioned — served as guest-landing redirect host.
# Cullinos — all frontend apps on VM (static SPAs + marketing proxy)
# Copy to /etc/nginx/sites-available/cullinos-frontends.conf
# SSL added automatically by certbot via scripts/remote-deploy.py

# Rate limits (http context — this file is included from http {})
limit_req_zone $binary_remote_addr zone=cullinos_web:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cullinos_contact:10m rate=1r/s;

map $host $cullinos_spa_root {
    admin.cullinos.com      /var/www/cullinos/admin;
    manage.cullinos.com     /var/www/cullinos/management;
    platform.cullinos.com   /var/www/cullinos/super-admin;
    order.cullinos.com      /var/www/cullinos/guest-landing;
    waiter.cullinos.com     /var/www/cullinos/waiter-landing;
    pos.cullinos.com        /var/www/cullinos/pos;
    kds.cullinos.com        /var/www/cullinos/kds;
    kiosk.cullinos.com      /var/www/cullinos/kiosk;
    default                 "";
}

server {
    server_name admin.cullinos.com manage.cullinos.com platform.cullinos.com
                order.cullinos.com waiter.cullinos.com pos.cullinos.com kds.cullinos.com
                kiosk.cullinos.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https:; font-src 'self' data:; connect-src 'self' https://api.cullinos.com wss://api.cullinos.com; frame-ancestors 'self'; base-uri 'self'; form-action 'self'" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # Hashed Vite assets — long cache, immutable
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        if ($cullinos_spa_root = "") {
            return 404;
        }
        root $cullinos_spa_root;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        if ($cullinos_spa_root = "") {
            return 404;
        }
        root $cullinos_spa_root;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.cullinos.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.cullinos.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Marketing site — Next.js on port 5180
upstream cullinos_web {
    server 127.0.0.1:5180;
    keepalive 8;
}

# Canonical marketing host is the apex; www only redirects.
server {
    server_name www.cullinos.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://cullinos.com$request_uri;
    }

    listen 443 ssl;
    ssl_certificate /etc/letsencrypt/live/admin.cullinos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/admin.cullinos.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}

server {
    server_name cullinos.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/contact {
        limit_req zone=cullinos_contact burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://cullinos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=cullinos_web burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://cullinos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.cullinos.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.cullinos.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


