# Cullinos — all frontend apps on VM (static SPAs + marketing proxy)
# Copy to /etc/nginx/sites-available/cullinos-frontends.conf
# SSL added automatically by certbot via scripts/remote-deploy.py

# Rate limits (http context — this file is included from http {})
limit_req_zone $binary_remote_addr zone=cullinos_web:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=cullinos_contact:10m rate=1r/s;

map $host $cullinos_spa_root {
    admin.cullinos.com      /var/www/cullinos/admin;
    manage.cullinos.com     /var/www/cullinos/management;
    platform.cullinos.com   /var/www/cullinos/super-admin;
    order.cullinos.com      /var/www/cullinos/customer;
    waiter.cullinos.com     /var/www/cullinos/waiter;
    pos.cullinos.com        /var/www/cullinos/pos;
    kds.cullinos.com        /var/www/cullinos/kds;
    default                 "";
}

server {
    server_name admin.cullinos.com manage.cullinos.com platform.cullinos.com
                order.cullinos.com waiter.cullinos.com pos.cullinos.com kds.cullinos.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        if ($cullinos_spa_root = "") {
            return 404;
        }
        root $cullinos_spa_root;
        try_files $uri $uri/ /index.html;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.cullinos.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.cullinos.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}

# Marketing site — Next.js on port 5180
upstream cullinos_web {
    server 127.0.0.1:5180;
    keepalive 8;
}

server {
    server_name cullinos.com www.cullinos.com;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location /api/contact {
        limit_req zone=cullinos_contact burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://cullinos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        limit_req zone=cullinos_web burst=20 nodelay;
        limit_req_status 429;
        proxy_pass http://cullinos_web;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/admin.cullinos.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/admin.cullinos.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot
}


server {
    if ($host = kds.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = pos.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = waiter.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = order.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = platform.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = manage.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = admin.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name admin.cullinos.com manage.cullinos.com platform.cullinos.com
                order.cullinos.com waiter.cullinos.com pos.cullinos.com kds.cullinos.com;
    return 404; # managed by Certbot
}

server {
    if ($host = www.cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    if ($host = cullinos.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name cullinos.com www.cullinos.com;
    return 404; # managed by Certbot
}
