# Nightly logical backup: pg_dump (custom format, compressed) -> AES-256 (openssl, PBKDF2)
# -> Cloudflare R2. Requires the `cullinos-backup` secret (see infrastructure/k8s/secrets.example.env) and
# egress to dl-cdn.alpinelinux.org and <account>.r2.cloudflarestorage.com.
# Retention is enforced by an R2 lifecycle rule on the bucket (recommend 35 days).
# Restore: aws s3 cp s3://$BUCKET/<key> - | openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 \
#   -pass env:BACKUP_ENCRYPTION_KEY | pg_restore --clean --if-exists -d "$DATABASE_URL"
apiVersion: batch/v1
kind: CronJob
metadata:
  name: db-backup
spec:
  schedule: "30 20 * * *" # 02:00 IST
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      activeDeadlineSeconds: 3600
      template:
        metadata:
          labels:
            app: db-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            seccompProfile:
              type: RuntimeDefault
          volumes:
            - name: work
              emptyDir: {}
          initContainers:
            - name: dump
              image: postgres:16-alpine
              command:
                - sh
                - -c
                - pg_dump -h postgres -U cullinos -d cullinos -Fc -Z 6 -f /work/cullinos.dump && ls -l /work
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: cullinos-secrets
                      key: POSTGRES_PASSWORD
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            - name: upload
              image: alpine:3.20
              command:
                - sh
                - -ec
                - |
                  apk add --no-cache openssl aws-cli >/dev/null
                  test -n "$BACKUP_ENCRYPTION_KEY"
                  KEY="${NAMESPACE}/$(date -u +%Y/%m/%d)/cullinos-$(date -u +%Y%m%dT%H%M%SZ).dump.enc"
                  openssl enc -aes-256-cbc -salt -pbkdf2 -iter 200000 \
                    -pass env:BACKUP_ENCRYPTION_KEY \
                    -in /work/cullinos.dump -out /work/cullinos.dump.enc
                  aws s3 cp /work/cullinos.dump.enc "s3://${R2_BACKUP_BUCKET}/${KEY}" \
                    --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" --only-show-errors
                  echo "Uploaded ${KEY}"
              env:
                - name: NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: AWS_DEFAULT_REGION
                  value: auto
                - name: BACKUP_ENCRYPTION_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cullinos-backup
                      key: BACKUP_ENCRYPTION_KEY
                - name: R2_ACCOUNT_ID
                  valueFrom:
                    secretKeyRef:
                      name: cullinos-backup
                      key: R2_ACCOUNT_ID
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: cullinos-backup
                      key: R2_ACCESS_KEY_ID
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: cullinos-backup
                      key: R2_SECRET_ACCESS_KEY
                - name: R2_BACKUP_BUCKET
                  valueFrom:
                    secretKeyRef:
                      name: cullinos-backup
                      key: R2_BACKUP_BUCKET
              securityContext:
                allowPrivilegeEscalation: false
              volumeMounts:
                - name: work
                  mountPath: /work
