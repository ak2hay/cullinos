# Edge security headers for every host on the Cullinos ingress. The SPA containers add
# the Content-Security-Policy themselves (docker/spa-nginx.conf) because the API and the
# Next.js marketing site need different policies.
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    stsSeconds: 31536000
    stsIncludeSubdomains: true
    forceSTSHeader: true
    contentTypeNosniff: true
    referrerPolicy: strict-origin-when-cross-origin
    customFrameOptionsValue: SAMEORIGIN
    permissionsPolicy: 'camera=(), microphone=(), geolocation=(), payment=(self "https://api.razorpay.com" "https://checkout.razorpay.com")'
    customResponseHeaders:
      Server: ""
      X-Powered-By: ""
