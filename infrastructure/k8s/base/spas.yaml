# One Deployment+Service per SPA. Images run nginx-unprivileged (uid 101) on :8080.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-admin
  labels:
    app: spa-admin
    app.kubernetes.io/component: spa
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spa-admin
  template:
    metadata:
      labels:
        app: spa-admin
        app.kubernetes.io/component: spa
    spec:
      automountServiceAccountToken: false
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: nginx
          image: ghcr.io/ak2hay/cullinos-spa-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
              name: http
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spa-admin
spec:
  selector:
    app: spa-admin
  ports:
    - port: 80
      targetPort: http
---
