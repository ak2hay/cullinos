# Shared template applied per SPA via kustomize nameSuffix / images in overlays.
# Each SPA is a separate Deployment+Service in this file.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: spa-admin
  labels:
    app: spa-admin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: spa-admin
  template:
    metadata:
      labels:
        app: spa-admin
    spec:
      containers:
        - name: nginx
          image: ghcr.io/ak2hay/cullinos-spa-admin:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 10m
              memory: 32Mi
            limits:
              cpu: 100m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: spa-admin
spec:
  selector:
    app: spa-admin
  ports:
    - port: 80
      targetPort: 80
---
