<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Cullinos Waiter</title>
    <style>
      :root { color-scheme: dark; --bg:#0f0f1a; --text:#f5f5f7; --muted:#9ca3af; --brand:#006D5B; }
      body { margin:0; min-height:100vh; font-family:system-ui,sans-serif; background:var(--bg); color:var(--text);
        display:flex; align-items:center; justify-content:center; padding:24px; }
      main { max-width:420px; width:100%; }
      h1 { font-size:1.5rem; margin:0 0 8px; }
      p { color:var(--muted); line-height:1.45; }
      a.btn { display:flex; align-items:center; justify-content:center; height:48px; border-radius:16px;
        text-decoration:none; font-weight:700; margin-top:12px; background:var(--brand); color:#fff; }
    </style>
  </head>
  <body>
    <main>
      <h1>Cullinos Waiter</h1>
      <p>The waiter portal is now an Android app for phone and tablet. Download it from Google Play, then sign in with your staff credentials.</p>
      <a class="btn" href="https://play.google.com/store/apps/details?id=com.cullinos.waiter">Download on Google Play</a>
    </main>
  </body>
</html>
