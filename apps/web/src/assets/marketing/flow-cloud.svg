<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 200" fill="none">
  <defs>
    <linearGradient id="cloud-bg" x1="0" y1="0" x2="600" y2="200" gradientUnits="userSpaceOnUse">
      <stop stop-color="#faf7f2"/>
      <stop offset="1" stop-color="#f5f0e8"/>
    </linearGradient>
    <style>
      .pulse { animation: pulse 2s ease-in-out infinite; }
      @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.7; } }
      .draw { stroke-dasharray: 8 4; animation: dash 20s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -100; } }
    </style>
  </defs>
  <rect width="600" height="200" rx="16" fill="url(#cloud-bg)" stroke="#ebe4d8"/>
  <!-- Admin -->
  <rect x="24" y="72" width="100" height="56" rx="10" fill="#ffffff" stroke="#c4a052" stroke-width="1.5"/>
  <text x="74" y="96" fill="#2c2416" font-family="Georgia,serif" font-size="11" font-weight="600" text-anchor="middle">Admin</text>
  <text x="74" y="112" fill="#9a8b78" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle">Menu · Staff</text>
  <!-- Cloud -->
  <ellipse cx="300" cy="100" rx="56" ry="36" fill="#c4a052" class="pulse"/>
  <text x="300" y="96" fill="#ffffff" font-family="Georgia,serif" font-size="12" font-weight="600" text-anchor="middle">Cullinos</text>
  <text x="300" y="112" fill="#ffffff" font-family="system-ui,sans-serif" font-size="9" text-anchor="middle" opacity="0.9">Cloud</text>
  <!-- POS -->
  <rect x="476" y="24" width="100" height="48" rx="10" fill="#ffffff" stroke="#ebe4d8"/>
  <text x="526" y="52" fill="#2c2416" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">POS</text>
  <!-- KDS -->
  <rect x="476" y="76" width="100" height="48" rx="10" fill="#ffffff" stroke="#ebe4d8"/>
  <text x="526" y="104" fill="#2c2416" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">KDS</text>
  <!-- Ordering -->
  <rect x="476" y="128" width="100" height="48" rx="10" fill="#ffffff" stroke="#ebe4d8"/>
  <text x="526" y="156" fill="#2c2416" font-family="system-ui,sans-serif" font-size="10" font-weight="600" text-anchor="middle">Ordering</text>
  <!-- Paths -->
  <path d="M124 100 H220" stroke="#c4a052" stroke-width="2" class="draw" fill="none"/>
  <path d="M356 88 L440 48" stroke="#6b5e4f" stroke-width="1.5" class="draw" fill="none"/>
  <path d="M356 100 L440 100" stroke="#6b5e4f" stroke-width="1.5" class="draw" fill="none"/>
  <path d="M356 112 L440 152" stroke="#6b5e4f" stroke-width="1.5" class="draw" fill="none"/>
</svg>
