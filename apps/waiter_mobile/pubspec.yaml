name: cullinos_waiter
description: Cullinos Waiter — floor staff app for phone and tablet
publish_to: "none"
version: 1.0.2+3

environment:
  sdk: ">=3.5.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.8.0+1
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2
  socket_io_client: ^3.0.2
  cached_network_image: ^3.4.1
  google_fonts: ^6.2.1
  intl: any
  qr_flutter: ^4.1.0
  collection: ^1.19.0
  audioplayers: ^6.1.0
  connectivity_plus: ^6.1.3
  package_info_plus: ^8.3.0
  url_launcher: ^6.3.1
  razorpay_flutter: ^1.4.0
  webview_flutter: ^4.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/images/
    - assets/sounds/
