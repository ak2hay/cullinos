name: E2E Production

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check E2E secrets
        id: gate
        env:
          OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
        run: |
          if [ -z "$OWNER_EMAIL" ] && [ "${{ github.event_name }}" = "schedule" ]; then
            echo "::notice::E2E secrets are not configured (E2E_OWNER_EMAIL empty); skipping scheduled production E2E"
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v7
        if: steps.gate.outputs.run == 'true'

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci
        if: steps.gate.outputs.run == 'true'

      - name: Install Playwright browsers
        if: steps.gate.outputs.run == 'true'
        run: npx playwright install chromium --with-deps

      - name: Run production E2E
        if: steps.gate.outputs.run == 'true'
        env:
          E2E_API_URL: ${{ secrets.E2E_API_URL }}
          E2E_WEB_URL: ${{ secrets.E2E_WEB_URL }}
          E2E_ADMIN_URL: ${{ secrets.E2E_ADMIN_URL }}
          E2E_MANAGEMENT_URL: ${{ secrets.E2E_MANAGEMENT_URL }}
          E2E_SUPER_ADMIN_URL: ${{ secrets.E2E_SUPER_ADMIN_URL }}
          E2E_WAITER_URL: ${{ secrets.E2E_WAITER_URL }}
          E2E_POS_URL: ${{ secrets.E2E_POS_URL }}
          E2E_KDS_URL: ${{ secrets.E2E_KDS_URL }}
          E2E_ORG_SLUG: ${{ secrets.E2E_ORG_SLUG }}
          E2E_OUTLET_SLUG: ${{ secrets.E2E_OUTLET_SLUG }}
          E2E_OUTLET_ID: ${{ secrets.E2E_OUTLET_ID }}
          E2E_OWNER_EMAIL: ${{ secrets.E2E_OWNER_EMAIL }}
          E2E_OWNER_PASSWORD: ${{ secrets.E2E_OWNER_PASSWORD }}
          E2E_SUPER_ADMIN_EMAIL: ${{ secrets.E2E_SUPER_ADMIN_EMAIL }}
          E2E_SUPER_ADMIN_PASSWORD: ${{ secrets.E2E_SUPER_ADMIN_PASSWORD }}
          E2E_WAITER_EMAIL: ${{ secrets.E2E_WAITER_EMAIL }}
          E2E_WAITER_PASSWORD: ${{ secrets.E2E_WAITER_PASSWORD }}
          E2E_CASHIER_EMAIL: ${{ secrets.E2E_CASHIER_EMAIL }}
          E2E_AUTO_PROVISION: ${{ secrets.E2E_AUTO_PROVISION }}
          E2E_SKIP_POS: 'true'
        run: npm run test:e2e

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            e2e-results.json
            test-results/
          retention-days: 14
