name: API Build

on:
  push:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'
      - 'railway.toml'
      - 'railpack.json'
      - 'index.js'
  pull_request:
    branches: [main]
    paths:
      - 'apps/api/**'
      - 'packages/**'
      - 'package.json'
      - 'package-lock.json'

jobs:
  build-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Build API (Railway command)
        run: npm run build:api

      - name: Verify onboard route exists in build output
        run: grep -q 'Post("organizations")' apps/api/dist/modules/super-admin/super-admin.controller.js
