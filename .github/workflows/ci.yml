name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: cullinos
          POSTGRES_PASSWORD: cullinos
          POSTGRES_DB: cullinos
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://cullinos:cullinos@localhost:5432/cullinos?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: test-jwt-secret-for-ci
      JWT_REFRESH_SECRET: test-jwt-refresh-secret-for-ci
      SUPER_ADMIN_JWT_SECRET: test-super-admin-secret-for-ci
      VITE_API_URL: http://localhost:3001/api/v1
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Apply migrations
        run: npm run db:migrate:deploy

      - name: Migrations match schema.prisma (drift check)
        run: |
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel packages/prisma/prisma/schema.prisma \
            --exit-code \
            || { echo "::error::schema.prisma has changes without a migration. Run: npx prisma migrate dev --schema packages/prisma/prisma/schema.prisma --name <change>"; exit 1; }

      - name: Frozen baseline schema reproduces 0_init
        run: |
          npx prisma migrate diff --from-empty \
            --to-schema-datamodel packages/prisma/prisma/baseline/schema-0_init.prisma \
            --script > /tmp/0_init.gen.sql
          diff -B packages/prisma/prisma/migrations/0_init/migration.sql /tmp/0_init.gen.sql \
            || { echo "::error::baseline/schema-0_init.prisma no longer matches migrations/0_init; it must stay frozen"; exit 1; }

      - name: Build packages the seed imports
        run: npm run build -w @cullinos/shared

      - name: Seed database
        run: npm run db:seed

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Test
        run: npm run test

  flutter:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        app: [guest, waiter_mobile]
    defaults:
      run:
        working-directory: apps/${{ matrix.app }}
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze --no-fatal-infos
      - run: flutter test

  images:
    if: github.event_name == 'push'
    needs: [build, flutter]
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/build-images.yml
    secrets: inherit
