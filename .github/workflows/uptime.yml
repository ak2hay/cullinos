name: Uptime Check

# Cloudflare Bot Fight Mode (free plan) challenges GitHub-hosted runners, so a curl
# of the public URLs returns 403 while the sites are up. SSH to the production VM
# and curl host nginx on 127.0.0.1 instead. That covers nginx, the origin cert,
# the vhost, and the app, without going through Cloudflare.
# Repo nginx listens on 443 for these hosts (infrastructure/nginx/). Port 80 only
# redirects them to HTTPS, so HTTP is a fallback when nothing accepts TLS on 443.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        url:
          - https://api.cullinos.com/api/v1/health
          - https://admin.cullinos.com/
    steps:
      - name: Check ${{ matrix.url }}
        shell: bash
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_SSH_KNOWN_HOSTS: ${{ secrets.DEPLOY_SSH_KNOWN_HOSTS }}
          TARGET_URL: ${{ matrix.url }}
        run: |
          set -euo pipefail

          if [[ -z "${DEPLOY_HOST:-}" || -z "${DEPLOY_SSH_KEY:-}" ]]; then
            echo "::error::Cannot check uptime. Actions secrets DEPLOY_HOST and DEPLOY_SSH_KEY are required (see docs/DEPLOYMENT.md)." >&2
            exit 1
          fi

          case "$TARGET_URL" in
            https://api.cullinos.com/api/v1/health|https://admin.cullinos.com/|https://admin.cullinos.com)
              ;;
            *)
              echo "::error::Unexpected uptime target." >&2
              exit 1
              ;;
          esac

          # Same key handling as scripts/ci/ship.sh. Strict host key checking when
          # DEPLOY_SSH_KNOWN_HOSTS is set; accept-new only when that secret is empty.
          workdir="$(mktemp -d)"
          trap 'rm -rf "$workdir"' EXIT
          install -m 700 -d "$workdir/ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" | tr -d '\r' > "$workdir/ssh/id"
          chmod 600 "$workdir/ssh/id"
          unset DEPLOY_SSH_KEY

          known="$workdir/ssh/known_hosts"
          strict=( -o StrictHostKeyChecking=accept-new )
          if [[ -n "${DEPLOY_SSH_KNOWN_HOSTS:-}" ]]; then
            printf '%s\n' "$DEPLOY_SSH_KNOWN_HOSTS" > "$known"
            strict=( -o StrictHostKeyChecking=yes )
          else
            : > "$known"
          fi
          unset DEPLOY_SSH_KNOWN_HOSTS

          port="${DEPLOY_SSH_PORT:-22}"
          target="root@${DEPLOY_HOST}"
          unset DEPLOY_HOST
          SSH=(
            ssh
            -i "$workdir/ssh/id"
            -p "$port"
            -o IdentitiesOnly=yes
            -o BatchMode=yes
            -o ConnectTimeout=20
            -o UserKnownHostsFile="$known"
            "${strict[@]}"
          )

          # SSH failure (VM down, auth, host key) fails the step. Do not swallow it.
          "${SSH[@]}" "$target" bash -s -- "$TARGET_URL" <<'REMOTE'
          set -euo pipefail
          url="$1"
          rest="${url#https://}"
          host="${rest%%/*}"
          if [[ "$rest" == */* ]]; then
            path="/${rest#*/}"
          else
            path="/"
          fi
          [[ -n "$host" && "$host" != *[!A-Za-z0-9.-]* ]] || {
            echo "::error::Bad host in uptime target" >&2
            exit 1
          }
          [[ "$path" =~ ^/[A-Za-z0-9._/-]*$ ]] || {
            echo "::error::Bad path in uptime target" >&2
            exit 1
          }

          err="$(mktemp)"
          trap 'rm -f "$err"' EXIT

          normalize() {
            local raw="${1//$'\n'/}"
            raw="${raw//[^0-9]/}"
            if [[ "$raw" =~ ^[0-9]{3}$ ]]; then
              printf '%s' "$raw"
            else
              printf '000'
            fi
          }

          set +e
          code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 --resolve "${host}:443:127.0.0.1" "$url" 2>"$err")"
          status=$?
          set -e
          code="$(normalize "$code")"

          # curl exit 7 is "could not connect": nginx is not accepting TLS on 443.
          # Other TLS failures (bad cert, timeout) fail the check; they are not a fallback.
          if [[ "$status" -eq 7 ]]; then
            echo "nginx is not accepting TLS on 127.0.0.1:443 for ${host}; falling back to HTTP port 80" >&2
            set +e
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H "Host: ${host}" "http://127.0.0.1${path}" 2>"$err")"
            status=$?
            set -e
            code="$(normalize "$code")"
            if [[ "$status" -ne 0 && "$code" == "000" ]]; then
              cat "$err" >&2
              echo "::error::HTTP fallback could not reach nginx on port 80 for ${host}" >&2
              exit 1
            fi
          elif [[ "$status" -ne 0 ]]; then
            cat "$err" >&2
            echo "::error::HTTPS check failed for ${url} (curl exit ${status})" >&2
            exit 1
          fi

          echo "HTTP ${code} for ${url}"
          if [[ "$code" != "200" && "$code" != "301" && "$code" != "302" ]]; then
            echo "::error::HTTP ${code} for ${url}" >&2
            exit 1
          fi
          REMOTE
