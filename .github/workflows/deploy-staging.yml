name: Deploy Staging

# Runs after CI (which builds images only when every check passes) on a push to develop.
on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (short SHA). Default: the checked-out commit."
        required: false
        default: ""
      skip_migrate:
        description: "Skip the Prisma migration Job"
        type: boolean
        default: false

concurrency:
  group: deploy-staging
  cancel-in-progress: false

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    # Set repo variable K8S_DEPLOY_ENABLED=true after the k3s cutover
    # (infrastructure/k8s/scripts/cutover-checklist.md); until then prod runs on Compose.
    if: >-
      vars.K8S_DEPLOY_ENABLED == 'true' && (
        github.event_name == 'workflow_dispatch' ||
        (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
      )
    runs-on: ubuntu-latest
    environment: staging
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      - name: Resolve image tag
        id: tag
        env:
          INPUT_TAG: ${{ github.event.inputs.image_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          TAG="${INPUT_TAG:-${HEAD_SHA::7}}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Deploying tag $TAG"

      - name: Setup kubectl
        uses: azure/setup-kubectl@v5
        with:
          version: v1.29.0

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Ensure namespace and GHCR pull secret
        env:
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN }}
        run: |
          kubectl create namespace staging --dry-run=client -o yaml | kubectl apply -f -
          TOKEN="${PULL_TOKEN:-${{ secrets.GITHUB_TOKEN }}}"
          kubectl create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$TOKEN" \
            --namespace=staging \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply app secrets
        env:
          APP_SECRETS: ${{ secrets.STAGING_APP_SECRETS_ENV }}
        run: |
          if [ -z "$APP_SECRETS" ]; then
            echo "STAGING_APP_SECRETS_ENV not set — leaving existing cullinos-secrets"
            exit 0
          fi
          umask 077
          printf '%s\n' "$APP_SECRETS" > /tmp/secrets.env
          kubectl -n staging create secret generic cullinos-secrets \
            --from-env-file=/tmp/secrets.env \
            --dry-run=client -o yaml | kubectl apply -f -
          rm -f /tmp/secrets.env

      - name: Migrate, roll out, smoke (auto-rollback on failure)
        run: |
          bash scripts/k8s-deploy.sh staging infrastructure/k8s/overlays/staging \
            "${{ steps.tag.outputs.tag }}" "${{ github.event.inputs.skip_migrate || 'false' }}"
