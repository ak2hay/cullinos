# Build and push all Cullinos images to GHCR.
# Tags: short SHA always; also `staging` on develop, `latest` on main.
name: Build Images

on:
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ak2hay

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: api
            file: Dockerfile
            context: .
            app_name: ""
          - name: web
            file: Dockerfile.web
            context: .
            app_name: ""
          - name: spa-admin
            file: Dockerfile.spa
            context: .
            app_name: admin
          - name: spa-management
            file: Dockerfile.spa
            context: .
            app_name: management
          - name: spa-super-admin
            file: Dockerfile.spa
            context: .
            app_name: super-admin
          - name: spa-pos
            file: Dockerfile.spa
            context: .
            app_name: pos
          - name: spa-kds
            file: Dockerfile.spa
            context: .
            app_name: kds
          - name: spa-guest-landing
            file: Dockerfile.spa
            context: .
            app_name: guest-landing
          - name: spa-waiter-landing
            file: Dockerfile.spa
            context: .
            app_name: waiter-landing

    steps:
      - uses: actions/checkout@v4

      - name: Set env URLs
        id: urls
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "api_url=https://api.cullinos.com/api/v1" >> "$GITHUB_OUTPUT"
            echo "ws_url=https://api.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "kds_url=https://kds.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "pos_url=https://pos.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "guest_url=https://guest.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "site_url=https://cullinos.com" >> "$GITHUB_OUTPUT"
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "api_url=https://staging-api.cullinos.com/api/v1" >> "$GITHUB_OUTPUT"
            echo "ws_url=https://staging-api.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "kds_url=https://staging-kds.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "pos_url=https://staging-pos.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "guest_url=https://staging-guest.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "site_url=https://staging.cullinos.com" >> "$GITHUB_OUTPUT"
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/cullinos-${{ matrix.name }}
          tags: |
            type=sha,prefix=,format=short
            type=raw,value=${{ steps.urls.outputs.channel }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          build-args: |
            APP_NAME=${{ matrix.app_name }}
            VITE_API_URL=${{ steps.urls.outputs.api_url }}
            VITE_WS_URL=${{ steps.urls.outputs.ws_url }}
            VITE_KDS_URL=${{ steps.urls.outputs.kds_url }}
            VITE_POS_URL=${{ steps.urls.outputs.pos_url }}
            VITE_GUEST_APP_URL=${{ steps.urls.outputs.guest_url }}
            NEXT_PUBLIC_API_URL=${{ steps.urls.outputs.api_url }}
            NEXT_PUBLIC_SITE_URL=${{ steps.urls.outputs.site_url }}
            NEXT_PUBLIC_TURNSTILE_SITE_KEY=${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
            NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN=${{ secrets.NEXT_PUBLIC_CF_WEB_ANALYTICS_TOKEN }}
