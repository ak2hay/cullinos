services:
  postgres:
    image: postgres:16-alpine
    container_name: cullinos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: cullinos
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: cullinos
    volumes:
      - cullinos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U cullinos -d cullinos']
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - cullinos

  redis:
    image: redis:7-alpine
    container_name: cullinos-redis
    restart: unless-stopped
    volumes:
      - cullinos_redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cullinos

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cullinos-api
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - '127.0.0.1:3000:3000'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - cullinos_marketing_uploads:/data/marketing-uploads
    networks:
      - cullinos

volumes:
  cullinos_pg_data:
  cullinos_redis_data:
  cullinos_marketing_uploads:

networks:
  cullinos:
    driver: bridge
