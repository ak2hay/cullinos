services:
  postgres:
    image: postgres:16-alpine
    container_name: cullinos-postgres
    environment:
      POSTGRES_USER: cullinos
      POSTGRES_PASSWORD: cullinos
      POSTGRES_DB: cullinos
    ports:
      - "5433:5432"
    volumes:
      - cullinos_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cullinos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cullinos-redis
    ports:
      - "6380:6379"
    volumes:
      - cullinos_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cullinos_pg_data:
  cullinos_redis_data:
