server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # nginx drops server-level add_header in any location that sets its own, so the
    # security headers are repeated per location. Keep in sync with
    # infrastructure/nginx/cullinos-frontends.conf and infrastructure/k8s/base/security-headers.yaml.

    # Hashed Vite assets
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|jpeg|webp|svg|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(self \"https://api.razorpay.com\" \"https://checkout.razorpay.com\")" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://checkout.razorpay.com https://sdk.cashfree.com https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' data: blob: https:; font-src 'self' data: https://fonts.gstatic.com; connect-src 'self' https://*.cullinos.com wss://*.cullinos.com https://*.razorpay.com https://*.cashfree.com https://challenges.cloudflare.com; frame-src 'self' https://api.razorpay.com https://checkout.razorpay.com https://*.cashfree.com https://challenges.cloudflare.com; worker-src 'self' blob:; object-src 'none'; frame-ancestors 'self'; base-uri 'self'; form-action 'self' https://api.razorpay.com https://*.cashfree.com" always;
        try_files $uri $uri/ /index.html;
    }
}
