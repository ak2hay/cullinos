# Railway / Nixpacks — avoid duplicate npm ci (install phase already runs it)
[phases.setup]
nixPkgs = ["nodejs_20", "npm-9_x", "openssl"]

[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = [
  "npm run db:generate",
  "npx turbo run build --filter=@cullinos/api --no-cache",
]

[start]
cmd = "node apps/api/dist/main.js"
